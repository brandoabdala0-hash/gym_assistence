<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto - Gym_Assistence</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <h2>GYM</h2>

        <a th:href="@{/panel}">Panel</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/registrarUsuario}">Registrar Usuario</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/registrarProducto}">Registrar Producto</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/registrarVenta}">Registrar Venta</a>
        <a th:href="@{/asistencia}">Asistencia</a>
        <a th:href="@{/historial}">Historial</a>
        <a th:href="@{/}">Cerrar sesión</a>

    </aside>

    <main class="content">

        <h1>Registro de Producto</h1>

        <p>Completa los datos para registrar un nuevo producto en el inventario.</p>

        <form th:action="@{/guardarProducto}" method="post">

            <input
                type="number"
                name="ref"
                placeholder="Referencia"
                required>

            <input
                type="text"
                name="producto"
                placeholder="Producto"
                required>

            <input
                type="number"
                name="cantidad"
                placeholder="Cantidad"
                required>

            <input
                type="number"
                step="0.01"
                name="costo"
                placeholder="Costo"
                required>

            <button type="submit">
                Registrar
            </button>

        </form>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>

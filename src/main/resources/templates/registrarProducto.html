<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto - Gym_Assistence</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <h2>GYM</h2>

        <a th:href="@{/panel}">Panel</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/registrarUsuario}">Registrar Usuario</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/registrarProducto}">Registrar Producto</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/registrarVenta}">Registrar Venta</a>
        <a th:href="@{/asistencia}">Asistencia</a>
        <a th:href="@{/historial}">Historial</a>
        <a href="#" onclick="cerrarSesion(); return false;">Cerrar sesión</a>

    </aside>

    <main class="content">

        <h1 th:text="${producto.id == null ? 'Registro de Producto' : 'Editar Producto'}">
            Registro de Producto
        </h1>

        <p th:text="${producto.id == null ? 'Completa los datos para registrar un nuevo producto en el inventario.' : 'Modifica los datos del producto y guarda los cambios.'}">
            Completa los datos para registrar un nuevo producto en el inventario.
        </p>

        <form th:action="@{/guardarProducto}" method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <input type="hidden" name="id" th:value="${producto.id}">

            <input
                type="number"
                name="ref"
                placeholder="Referencia"
                th:value="${producto.ref}"
                required>

            <input
                type="text"
                name="producto"
                placeholder="Producto"
                th:value="${producto.producto}"
                required>

            <input
                type="number"
                name="cantidad"
                placeholder="Cantidad"
                th:value="${producto.cantidad}"
                required>

            <input
                type="number"
                step="0.01"
                name="costo"
                placeholder="Costo"
                th:value="${producto.costo}"
                required>

            <button type="submit">
                <span th:text="${producto.id == null ? 'Registrar' : 'Guardar cambios'}">Registrar</span>
            </button>

        </form>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>

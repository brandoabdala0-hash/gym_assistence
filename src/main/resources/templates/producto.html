<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Gym_Assistence</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <h2>GYM</h2>

        <a th:href="@{/panel}">Panel</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/registrarUsuario}">Registrar Usuario</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/registrarProducto}">Registrar Producto</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/registrarVenta}">Registrar Venta</a>
        <a th:href="@{/asistencia}">Asistencia</a>
        <a th:href="@{/historial}">Historial</a>
        <a th:href="@{/}">Cerrar sesión</a>

    </aside>

    <main class="content">

        <h1>Productos Registrados</h1>

        <table>

            <tr>
                <th>Referencia</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Costo</th>
                <th>Acciones</th>
            </tr>

            <tr th:each="producto : ${productos}">

                <td th:text="${producto.ref}"></td>
                <td th:text="${producto.producto}"></td>
                <td th:text="${producto.cantidad}"></td>
                <td th:text="${producto.costo}"></td>

                <td>

                  <a th:href="@{/editarProducto/{id}(id=${producto.id})}">
                     Editar
                  </a>

                  <a th:href="@{/eliminarProducto/{id}(id=${producto.id})}">
                     Eliminar
                  </a>

                </td>

            </tr>

        </table>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>

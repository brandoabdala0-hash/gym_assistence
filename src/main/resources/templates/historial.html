<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Gym_Assistence</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <h2>GYM</h2>

        <a th:href="@{/panel}">Panel</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/registrarUsuario}">Registrar Usuario</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/registrarProducto}">Registrar Producto</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/registrarVenta}">Registrar Venta</a>
        <a th:href="@{/asistencia}">Asistencia</a>
        <a th:href="@{/historial}">Historial</a>
        <a th:href="@{/}">Cerrar sesión</a>

    </aside>

    <main class="content">

        <h1>Historial del Sistema</h1>

        <form th:action="@{/eliminarHistorial}" method="post"
              onsubmit="return confirm('¿Seguro que deseas borrar todo el historial? Esta acción no se puede deshacer.');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Borrar todo el historial</button>
        </form>

        <table>

            <tr>
                <th>ID</th>
                <th>Identificación</th>
                <th>Nombre</th>
                <th>Módulo</th>
                <th>Acción</th>
                <th>Fecha</th>
            </tr>

            <tr th:each="historial : ${historiales}">

                <td th:text="${historial.id}"></td>
                <td th:text="${historial.identificacion}"></td>
                <td th:text="${historial.nombre}"></td>
                <td th:text="${historial.modulo}"></td>
                <td th:text="${historial.accion}"></td>
                <td th:text="${historial.fecha}"></td>

            </tr>

        </table>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>

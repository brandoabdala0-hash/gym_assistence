<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia - Gym_Assistence</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <h2>Menú</h2>

        <a th:href="@{/panel}">Panel</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/asistencia}">Asistencia</a>
        <a th:href="@{/historial}">Historial</a>
        <a th:href="@{/}">Cerrar sesión</a>

    </aside>

    <main class="content">

        <h1>Registro de Asistencia</h1>

        <table>

            <tr>
                <th>Identificación</th>
                <th>Nombre</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>

            <tr th:each="asistencia : ${asistencias}">

                <td th:text="${asistencia.identificacion}"></td>
                <td th:text="${asistencia.nombre}"></td>
                <td th:text="${asistencia.fecha}"></td>

                <td>

                  <a th:href="@{/editarAsistencia/{id}(id=${asistencia.id})}">
                     Editar
                  </a>

                  <a th:href="@{/eliminarAsistencia/{id}(id=${asistencia.id})}">
                     Eliminar
                  </a>

                </td>

            </tr>

        </table>

        <hr>

        <h1>Registrar Asistencia</h1>

        <form th:action="@{/guardarAsistencia}" method="post" th:object="${asistencia}">

            <input type="hidden" th:field="*{id}">

            <input
                type="number"
                th:field="*{identificacion}"
                placeholder="Identificación"
                required>

            <input
                type="text"
                th:field="*{nombre}"
                placeholder="Nombre"
                required>

            <button type="submit">
                Registrar
            </button>

        </form>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario - Gym_Assistence</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <h2>GYM</h2>

        <a th:href="@{/panel}">Panel</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/registrarUsuario}">Registrar Usuario</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/registrarProducto}">Registrar Producto</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/registrarVenta}">Registrar Venta</a>
        <a th:href="@{/asistencia}">Asistencia</a>
        <a th:href="@{/historial}">Historial</a>
        <a th:href="@{/}">Cerrar sesión</a>

    </aside>

    <main class="content">

        <h1 th:text="${usuario.id == null ? 'Registro de Usuario' : 'Editar Usuario'}">
            Registro de Usuario
        </h1>

        <p th:text="${usuario.id == null ? 'Completa los datos para registrar un nuevo usuario en el sistema.' : 'Modifica los datos del usuario y guarda los cambios.'}">
            Completa los datos para registrar un nuevo usuario en el sistema.
        </p>

        <form th:action="@{/guardarUsuario}" method="post" th:object="${usuario}">

            <input type="hidden" th:field="*{id}">

            <input
                type="number"
                th:field="*{identificacion}"
                placeholder="Identificación"
                required>

            <input
                type="text"
                th:field="*{nombre}"
                placeholder="Nombre"
                required>

            <input
                type="number"
                th:field="*{edad}"
                placeholder="Edad"
                required>

            <input
                type="number"
                th:field="*{numero}"
                placeholder="Número"
                required>

            <button type="submit">
                <span th:text="${usuario.id == null ? 'Registrar' : 'Guardar cambios'}">Registrar</span>
            </button>

        </form>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>

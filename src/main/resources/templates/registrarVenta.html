<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Venta - Gym_Assistence</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <h2>GYM</h2>

        <a th:href="@{/panel}">Panel</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/registrarUsuario}">Registrar Usuario</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/registrarProducto}">Registrar Producto</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/registrarVenta}">Registrar Venta</a>
        <a th:href="@{/asistencia}">Asistencia</a>
        <a th:href="@{/historial}">Historial</a>
        <a th:href="@{/}">Cerrar sesión</a>

    </aside>

    <main class="content">

        <h1 th:text="${venta.ref == null ? 'Registro de Venta' : 'Editar Venta'}">
            Registro de Venta
        </h1>

        <p th:text="${venta.ref == null ? 'Completa los datos para registrar una nueva venta (la fecha y el total se calculan automáticamente).' : 'Modifica los datos de la venta y guarda los cambios.'}">
            Completa los datos para registrar una nueva venta (la fecha y el total se calculan automáticamente).
        </p>

        <form th:action="@{/guardarVenta}" method="post">

            <input
                type="number"
                name="ref"
                placeholder="Referencia"
                th:value="${venta.ref}"
                required>

            <input
                type="text"
                name="producto"
                placeholder="Producto"
                th:value="${venta.producto}"
                required>

            <input
                type="number"
                name="cantidad"
                placeholder="Cantidad"
                th:value="${venta.cantidad}"
                required>

            <input
                type="number"
                step="0.01"
                name="precio"
                placeholder="Precio"
                th:value="${venta.precio}"
                required>

            <button type="submit">
                <span th:text="${venta.ref == null ? 'Registrar' : 'Guardar cambios'}">Registrar</span>
            </button>

        </form>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>

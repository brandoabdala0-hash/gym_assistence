<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - Gym_Assistence</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <h2>Menú</h2>

        <a th:href="@{/panel}">Panel</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/asistencia}">Asistencia</a>
        <a th:href="@{/historial}">Historial</a>
        <a th:href="@{/}">Cerrar sesión</a>

    </aside>

    <main class="content">

        <h1>Ventas</h1>

        <input id="ventaProducto" placeholder="Producto">
        <input id="ventaRef" placeholder="Referencia">
        <input id="ventaUsuario" placeholder="Usuario">
        <input id="ventaFecha" placeholder="Fecha">

        <button onclick="registrarVenta()">
            Registrar
        </button>

        <table id="tablaVentas">
            <tr>
                <th>Producto</th>
                <th>Referencia</th>
                <th>Usuario</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </table>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>

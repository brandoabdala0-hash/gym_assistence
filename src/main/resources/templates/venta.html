<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - Gym_Assistence</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <h2>Menú</h2>

        <a th:href="@{/panel}">Panel</a>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/productos}">Productos</a>
        <a th:href="@{/ventas}">Ventas</a>
        <a th:href="@{/asistencia}">Asistencia</a>
        <a th:href="@{/historial}">Historial</a>
        <a th:href="@{/}">Cerrar sesión</a>

    </aside>

    <main class="content">

        <h1>Ventas Registradas</h1>

        <table>

            <tr>
                <th>Referencia</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Acciones</th>
            </tr>

            <tr th:each="venta : ${ventas}">

                <td th:text="${venta.ref}"></td>
                <td th:text="${venta.producto}"></td>
                <td th:text="${venta.cantidad}"></td>
                <td th:text="${venta.fecha}"></td>
                <td th:text="${venta.total}"></td>

                <td>

                    <a th:href="@{/editarVenta/{ref}(ref=${venta.ref})}">
                        Editar
                    </a>

                    <a th:href="@{/eliminarVenta/{ref}(ref=${venta.ref})}">
                        Eliminar
                    </a>

                </td>

            </tr>

        </table>

        <hr>

        <h1>Registrar Venta</h1>

        <form th:action="@{/guardarVenta}" method="post" th:object="${venta}">

            <input
                type="number"
                th:field="*{ref}"
                placeholder="Referencia"
                required>

            <input
                type="text"
                th:field="*{producto}"
                placeholder="Producto"
                required>

            <input
                type="number"
                th:field="*{cantidad}"
                placeholder="Cantidad"
                required>

            <input
                type="datetime-local"
                th:field="*{fecha}"
                required>

            <input
                type="number"
                step="0.01"
                th:field="*{precio}"
                placeholder="Precio"
                required>

            <input
                type="number"
                step="0.01"
                th:field="*{total}"
                placeholder="Total"
                required>

            <button type="submit">
                Registrar
            </button>

        </form>

    </main>

</div>

<script th:src="@{/js/main.js}"></script>

</body>
</html>
